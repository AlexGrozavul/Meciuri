<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meciurile mele</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2436C9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;600;700&family=Karla:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7E7E2; --surface:#FBFAF7; --ink:#101114; --muted:#6B6E76;
  --line:#D5D5CE; --accent:#2436C9; --accent-soft:#DDE0F7;
  --pitch:#C9CFC4; --pitch-line:#AEB6A8; --chip:#FBFAF7;
  --warn:#8A6A1F; --shadow:0 1px 2px rgba(0,0,0,.07),0 6px 18px rgba(0,0,0,.05);
}
html[data-theme="dark"]{
  --bg:#0C0E12; --surface:#15181E; --ink:#EFF1F4; --muted:#878C96;
  --line:#262A32; --accent:#8194FF; --accent-soft:#1D2440;
  --pitch:#1B2420; --pitch-line:#2E3B34; --chip:#20242C;
  --warn:#C9A24A; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Karla,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.5;padding-bottom:78px;
  transition:background .18s,color .18s}
h1,h2,h3,.disp{font-family:"Saira Condensed",Impact,sans-serif;font-weight:700;
  letter-spacing:.01em;margin:0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);padding:10px 16px 8px;
  display:flex;align-items:center;gap:10px}
.top h1{font-size:20px;text-transform:uppercase;letter-spacing:.06em;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tog{border:1px solid var(--line);border-radius:999px;padding:3px 9px;
  font-family:"Saira Condensed",sans-serif;font-size:13px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;background:var(--surface)}
.tog:active{background:var(--accent-soft)}

/* ---------- bottom tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;padding:11px 4px 13px;font-family:"Saira Condensed",sans-serif;
  font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;
  color:var(--muted);border-top:2px solid transparent;margin-top:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-top-color:var(--accent)}

.wrap{max-width:640px;margin:0 auto;padding:16px}
.eyebrow{font-family:"Saira Condensed",sans-serif;font-size:12px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.eyebrow:first-child{margin-top:4px}

/* ---------- ticket stub card ---------- */
.stub{position:relative;display:flex;background:var(--surface);border:1px solid var(--line);
  border-radius:3px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden;
  width:100%;text-align:left;align-items:stretch}
.stub .num{flex:0 0 40px;display:flex;align-items:center;justify-content:center;
  font-family:"Saira Condensed",sans-serif;font-size:19px;font-weight:700;
  color:var(--muted);background:var(--bg);
  border-right:1px dashed var(--line);position:relative}
.stub .num::before,.stub .num::after{content:"";position:absolute;right:-5px;
  width:9px;height:9px;border-radius:50%;background:var(--bg);
  border:1px solid var(--line)}
.stub .num::before{top:-5px}
.stub .num::after{bottom:-5px}
.stub .body{flex:1;padding:10px 12px;min-width:0}
.stub .teams{font-family:"Saira Condensed",sans-serif;font-size:19px;font-weight:700;
  line-height:1.15;display:flex;gap:8px;align-items:baseline}
.stub .teams .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stub .sc{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.stub .meta{font-size:12.5px;color:var(--muted);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stub .foot{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.pill{font-family:"Saira Condensed",sans-serif;font-size:11.5px;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase;border:1px solid var(--line);
  border-radius:999px;padding:1px 7px;color:var(--muted)}
.pill.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* ---------- support picker ---------- */
.sup{display:flex;gap:5px;margin-top:8px}
.sup button{flex:1;border:1px solid var(--line);border-radius:3px;padding:4px 2px;
  font-family:"Saira Condensed",sans-serif;font-size:12px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sup button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
html[data-theme="dark"] .sup button[aria-pressed="true"]{color:#0C0E12}

/* ---------- me tab ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:3px;
  padding:11px 12px}
.stat b{font-family:"Saira Condensed",sans-serif;font-size:30px;font-weight:700;
  display:block;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);display:block;margin-top:4px}
.stat i{display:block;font-style:normal;font-size:11px;color:var(--muted);
  margin-top:3px;font-variant-numeric:tabular-nums;opacity:.85}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:3px}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;
  border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:none}
.row .k{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .v{color:var(--muted);font-variant-numeric:tabular-nums;flex-shrink:0}
.wdl{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.wdl div{flex:1;padding:10px;text-align:center;background:var(--surface);
  border-right:1px solid var(--line)}
.wdl div:last-child{border-right:none}
.wdl b{font-family:"Saira Condensed",sans-serif;font-size:26px;display:block;line-height:1}
.wdl span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

/* ---------- detail ---------- */
.back{font-family:"Saira Condensed",sans-serif;font-size:14px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 0 10px}
.dhead{background:var(--surface);border:1px solid var(--line);border-radius:3px;
  padding:14px;text-align:center;margin-bottom:12px}
.dhead .comp{font-size:12px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.1em;font-family:"Saira Condensed",sans-serif;font-weight:600}
.dhead .big{display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0 4px}
.dhead .big .t{font-family:"Saira Condensed",sans-serif;font-size:21px;font-weight:700;
  flex:1;line-height:1.1}
.dhead .big .t:first-child{text-align:right}
.dhead .big .t:last-child{text-align:left}
.dhead .res{font-family:"Saira Condensed",sans-serif;font-size:34px;font-weight:700;
  font-variant-numeric:tabular-nums;line-height:1}
.dhead .sub{font-size:12.5px;color:var(--muted)}
.subtabs{display:flex;gap:4px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{border:1px solid var(--line);border-radius:999px;padding:5px 12px;
  font-family:"Saira Condensed",sans-serif;font-size:13px;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  background:var(--surface);white-space:nowrap}
.subtabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
html[data-theme="dark"] .subtabs button[aria-selected="true"]{color:#0C0E12}

/* ---------- pitch ---------- */
.teamsw{display:flex;gap:4px;margin-bottom:10px}
.teamsw button{flex:1;border:1px solid var(--line);border-radius:3px;padding:7px 4px;
  font-family:"Saira Condensed",sans-serif;font-size:14px;font-weight:600;
  color:var(--muted);background:var(--surface);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.teamsw button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
html[data-theme="dark"] .teamsw button[aria-pressed="true"]{color:#0C0E12}
.pitch{position:relative;width:100%;aspect-ratio:3/4;background:var(--pitch);
  border:1px solid var(--line);border-radius:4px;overflow:hidden}
.pitch .mk{position:absolute;border:1.5px solid var(--pitch-line)}
.pitch .box{left:22%;width:56%;height:13%;bottom:0;border-bottom:none}
.pitch .six{left:37%;width:26%;height:5.5%;bottom:0;border-bottom:none}
.pitch .circ{left:50%;top:50%;width:26%;aspect-ratio:1;border-radius:50%;
  transform:translate(-50%,-50%)}
.pitch .half{left:0;right:0;top:50%;height:0;border-width:0 0 1.5px 0}
.plr{position:absolute;transform:translate(-50%,-50%);width:56px;text-align:center}
.plr .no{display:inline-flex;align-items:center;justify-content:center;
  width:27px;height:27px;border-radius:50%;background:var(--chip);
  border:1px solid var(--line);font-family:"Saira Condensed",sans-serif;
  font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;position:relative}
.plr .nm{font-size:10.5px;line-height:1.15;margin-top:2px;
  text-shadow:0 1px 2px var(--pitch);font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{position:absolute;top:-5px;font-size:9px;line-height:1;
  padding:2px 3px;border-radius:3px;font-weight:700}
.badge:nth-of-type(1){right:-7px}
.badge:nth-of-type(2){left:-7px}
.badge:nth-of-type(3){right:-7px;top:16px}
.badge.g{background:none;padding:0;font-size:13px;line-height:1;
  width:14px;height:14px;display:flex;align-items:center;justify-content:center;
  text-shadow:0 0 2px rgba(0,0,0,.5)}
.badge.y{background:#E8C23B;width:8px;height:12px;border-radius:1px}
.badge.r{background:#D2372F;width:8px;height:12px;border-radius:1px}
.badge.o{background:#D2372F;color:#fff;border-radius:50%;width:14px;height:14px;
  display:flex;align-items:center;justify-content:center;font-size:11px}
.form{text-align:center;font-family:"Saira Condensed",sans-serif;font-weight:700;
  letter-spacing:.22em;font-size:16px;margin:8px 0 2px}
.coach{text-align:center;font-size:12.5px;color:var(--muted);margin-bottom:14px}

/* ---------- lists inside detail ---------- */
.ev{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.ev:last-child{border-bottom:none}
.ev .m{flex:0 0 46px;font-family:"Saira Condensed",sans-serif;font-weight:700;
  font-variant-numeric:tabular-nums;color:var(--muted)}
.ev .ic{flex:0 0 18px;text-align:center}
.ev .tx{flex:1;min-width:0}
.ev .tx em{font-style:normal;color:var(--muted);font-size:12.5px}
.ev.away{flex-direction:row-reverse;text-align:right}
.ev.away .tx{text-align:right}

/* ---------- stat bars ---------- */
.bar{margin-bottom:12px}
.bar .lb{display:flex;justify-content:space-between;font-size:13px;
  font-variant-numeric:tabular-nums;margin-bottom:3px}
.bar .lb b{font-family:"Saira Condensed",sans-serif;font-size:15px}
.bar .lb span{font-size:11px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.08em;font-family:"Saira Condensed",sans-serif;font-weight:600;
  align-self:center}
.bar .tr{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line)}
.bar .tr i{display:block;height:100%}
.bar .tr i:first-child{background:var(--muted)}
.bar .tr i:last-child{background:var(--accent)}

/* ---------- forms ---------- */
.field{margin-bottom:11px}
.field label{display:block;font-family:"Saira Condensed",sans-serif;font-size:12px;
  font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  margin-bottom:3px}
.field input,.field textarea{width:100%;background:var(--surface);
  border:1px solid var(--line);border-radius:3px;padding:8px 10px;font-size:15px}
.field textarea{min-height:110px;resize:vertical;line-height:1.5}
.factnote{background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--accent);border-radius:3px;padding:11px 13px;
  font-size:14px;line-height:1.55;margin-bottom:14px}
.na{color:var(--muted);font-style:italic}
.warnbox{border:1px solid var(--line);border-left:3px solid var(--warn);
  background:var(--surface);border-radius:3px;padding:10px 12px;font-size:13px;
  color:var(--muted);margin-bottom:14px}
.btn{display:inline-block;border:1px solid var(--accent);background:var(--accent);
  color:#fff;border-radius:3px;padding:9px 16px;font-family:"Saira Condensed",sans-serif;
  font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
html[data-theme="dark"] .btn{color:#0C0E12}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;
  font-size:13.5px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px}

/* ---------- foto / video ---------- */
.mediabar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.mediabar .count{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.mcell{position:relative;padding:0;aspect-ratio:1/1;overflow:hidden;border:1px solid var(--line);
  border-radius:3px;background:var(--surface);display:block}
.mcell img,.mcell video{width:100%;height:100%;object-fit:cover;display:block}
.mcell .tagv{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.68);color:#fff;
  font-family:"Saira Condensed",sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;
  padding:1px 5px;border-radius:2px}
.mover{position:fixed;inset:0;z-index:70;background:#000;display:flex;flex-direction:column}
.mover .mtop{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px}
.mover .mtop button{font-family:"Saira Condensed",sans-serif;font-size:14px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;color:#fff;border:1px solid rgba(255,255,255,.35);
  border-radius:3px;padding:7px 14px}
.mover .mbody{flex:1;display:flex;align-items:center;justify-content:center;padding:6px;min-height:0}
.mover img,.mover video{max-width:100%;max-height:100%;object-fit:contain}
.mover .mcap{color:#B9BDC6;font-size:12px;padding:8px 12px 14px;text-align:center;word-break:break-all}
</style>
</head>
<body>

<div class="top">
  <h1 id="topTitle">Meciurile mele</h1>
  <button class="tog" id="langBtn">RO</button>
  <button class="tog" id="themeBtn">☾</button>
</div>

<div id="view" class="wrap"></div>

<nav class="tabs" role="tablist">
  <button role="tab" data-tab="me"      aria-selected="true">Eu</button>
  <button role="tab" data-tab="matches" aria-selected="false">Meciuri</button>
  <button role="tab" data-tab="events"  aria-selected="false">Evenimente</button>
</nav>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
/* înregistrarea service worker-ului; eșuează silențios dacă fișierul lipsește
   sau dacă pagina e deschisă direct de pe disc (file://) */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
<script>
/* =====================================================================
   stare
   ===================================================================== */
if(typeof APP_DATA==='undefined'){
  document.getElementById('view').innerHTML =
    '<div class="warnbox" style="border-left-color:#D2372F">'
    +'<b>data.js nu a fost găsit.</b><br>'
    +'Fișierul data.js trebuie să fie în același folder cu index.html. '
    +'Dacă deschizi index.html singur, aplicația nu are ce afișa.</div>';
  throw new Error('data.js missing');
}
var LS_P='mf_personal', LS_L='mf_lang', LS_T='mf_theme', LS_I='mf_imported';
function T_HAS(l){ return l==='ro' || l==='en'; }
function load(k,f){
  try{
    var v=localStorage.getItem(k);
    if(v===null) return f;
    try{ return JSON.parse(v); }
    catch(e){ return v; }          /* valori vechi salvate ca text simplu */
  }catch(e){ return f; }
}
function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }

var lang  = load(LS_L,'ro');
var theme = load(LS_T,'light');
if(!T_HAS(lang)) lang='ro';
if(theme!=='dark' && theme!=='light') theme='light';
var personal = load(LS_P, {});
var imported = load(LS_I, []);
var tab='me', openId=null, sub='lineups', side='home';

function matches(){
  var base = APP_DATA.matches.slice();
  imported.forEach(function(m){
    var i = base.findIndex(function(b){ return b.id===m.id; });
    if(i>=0) base[i]=m; else base.push(m);
  });
  base.sort(function(a,b){ return a.date < b.date ? -1 : 1; });
  return base;
}
function findEvent(id){
  var ev=(APP_DATA.events||[]).filter(function(e){ return e.id===id; });
  return ev.length?ev[0]:null;
}
function P(id){ return personal[id] || {}; }
function setP(id,k,v){ personal[id]=personal[id]||{}; personal[id][k]=v; save(LS_P,personal); }

/* =====================================================================
   texte
   ===================================================================== */

  document.documentElement.lang = lang;
  document.getElementById('langBtn').textContent = lang.toUpperCase();

  document.getElementById('topTitle').textContent = t('title');
  document.querySelectorAll('.tabs button').forEach(function(b){

    b.setAttribute('aria-selected', String(b.dataset.tab===tab));
  });

function paneTimeline(m){
  var ev=[];
  (m.goals||[]).forEach(function(g){
    ev.push({t:g.team,m:g.minute,a:g.added||0,ic:'⚽',
      tx:esc(g.player)+(g.pen?' (pen.)':''), sub:g.assist?('↳ '+esc(g.assist)):''});
  });
  (m.cards||[]).forEach(function(c){
    ev.push({t:c.team,m:(c.minute==null?-1:c.minute),a:c.added||0,
      ic:c.type==='yellow'?'🟨':'🟥', tx:(c.player==null?'—':esc(c.player)),
      sub:c.type==='second-yellow'?(lang==='en'?'second yellow':'al doilea galben'):''});
  });
  if(m.lineups){
    ['home','away'].forEach(function(sd){
      var lu=m.lineups[sd]; if(!lu||!lu.subs) return;
      lu.subs.forEach(function(s){
        ev.push({t:sd,m:s.minute,a:0,ic:'⇄',tx:'↑ '+esc(s.on),sub:'↓ '+esc(s.off)});
      });
    });
  }
  if(!ev.length) return '<div class="empty">'+t('na')+'</div>';
  ev.sort(function(x,y){ return (x.m-y.m)||(x.a-y.a); });
  return '<div class="rows" style="padding:2px 12px">'+ev.map(function(e){
    return '<div class="ev'+(e.t==='away'?' away':'')+'">'
      +'<div class="m">'+(e.m<0?'—':e.m+(e.a?'+'+e.a:'')+"'")+'</div>'
      +'<div class="ic">'+e.ic+'</div>'
      +'<div class="tx">'+e.tx+(e.sub?'<br><em>'+e.sub+'</em>':'')+'</div></div>';
  }).join('')+'</div>';
}

/* ---------- foto / video (IndexedDB, doar pe telefonul acesta) ---------- */
var MDB_NAME='mf_media', MDB_STORE='items', mdb=null, mediaUrls=[];

function mdbOpen(){
  if(mdb) return Promise.resolve(mdb);
  return new Promise(function(res,rej){
    if(!window.indexedDB){ rej(new Error('no idb')); return; }
    var rq=indexedDB.open(MDB_NAME,1);
    rq.onupgradeneeded=function(){
      var db=rq.result;
      if(!db.objectStoreNames.contains(MDB_STORE)){
        var st=db.createObjectStore(MDB_STORE,{keyPath:'key',autoIncrement:true});
        st.createIndex('matchId','matchId',{unique:false});
      }
    };
    rq.onsuccess=function(){ mdb=rq.result; res(mdb); };
    rq.onerror=function(){ rej(rq.error); };
  });
}
function mdbTx(mode){
  return mdbOpen().then(function(db){ return db.transaction(MDB_STORE,mode).objectStore(MDB_STORE); });
}
function mediaList(matchId){
  return mdbTx('readonly').then(function(st){
    return new Promise(function(res,rej){
      var out=[], rq=st.index('matchId').openCursor(IDBKeyRange.only(matchId));
      rq.onsuccess=function(){
        var c=rq.result;
        if(c){ out.push(c.value); c.continue(); }
        else { out.sort(function(a,b){ return (a.added||0)-(b.added||0); }); res(out); }
      };
      rq.onerror=function(){ rej(rq.error); };
    });
  });
}
function mediaAdd(matchId,file){
  return mdbTx('readwrite').then(function(st){
    return new Promise(function(res,rej){
      var rec={matchId:matchId,name:file.name||'',mime:file.type||'',size:file.size||0,
               kind:(file.type||'').indexOf('video')===0?'video':'image',
               added:Date.now(),blob:file};
      var rq=st.add(rec);
      rq.onsuccess=function(){ res(rq.result); };
      rq.onerror=function(){ rej(rq.error); };
    });
  });
}
function mediaDelete(key){
  return mdbTx('readwrite').then(function(st){
    return new Promise(function(res,rej){
      var rq=st.delete(key);
      rq.onsuccess=function(){ res(); };
      rq.onerror=function(){ rej(rq.error); };
    });
  });
}
function mediaRevoke(){
  mediaUrls.forEach(function(u){ try{ URL.revokeObjectURL(u); }catch(e){} });
  mediaUrls=[];
}
function mediaUrl(blob){ var u=URL.createObjectURL(blob); mediaUrls.push(u); return u; }

function fmtBytes(b){
  if(b>=1073741824) return (b/1073741824).toFixed(1)+' GB';
  if(b>=1048576)    return (b/1048576).toFixed(0)+' MB';
  return (b/1024).toFixed(0)+' KB';
}
var mediaPersisted=null;
function mediaPersistAsk(){
  if(!navigator.storage || !navigator.storage.persisted) return Promise.resolve(null);
  return navigator.storage.persisted().then(function(has){
    if(has) return true;
    if(!navigator.storage.persist) return false;
    return navigator.storage.persist();
  }).then(function(ok){ mediaPersisted=ok; return ok; })
   .catch(function(){ return null; });
}
function mediaQuotaLine(){
  var el=document.getElementById('mquota'); if(!el) return;
  if(!navigator.storage || !navigator.storage.estimate){ el.textContent=''; return; }
  navigator.storage.estimate().then(function(est){
    if(!est || !est.quota){ el.textContent=''; return; }
    el.style.marginLeft='auto';
    el.textContent = t('mediaQuota')
      .replace('{used}',fmtBytes(est.usage||0))
      .replace('{quota}',fmtBytes(est.quota));
  }).catch(function(){ el.textContent=''; });
}
function mediaPersistLine(){
  var el=document.getElementById('mpersist'); if(!el) return;
  mediaPersistAsk().then(function(ok){
    if(ok===null){ el.textContent=''; el.style.display='none'; return; }
    el.style.display='';
    el.textContent = ok ? t('mediaPersist') : t('mediaNoPersist');
  });
}
function paneMedia(m){
  return '<div class="mediabar">'
    +'<label class="btn" for="mfile">'+t('addMedia')+'</label>'
    +'<input id="mfile" type="file" accept="image/*,video/*" multiple '
    +'data-mid="'+esc(m.id)+'" style="position:absolute;width:1px;height:1px;opacity:0">'
    +'<span class="count" id="mcount"></span>'
    +'<span class="count" id="mquota"></span></div>'

    +'<div class="warnbox">'+t('mediaHint')+'</div>'

}
function mediaRender(matchId){
  var grid=document.getElementById('mgrid'); if(!grid) return;
  mediaQuotaLine(); mediaPersistLine();
  mediaList(matchId).then(function(items){
    var cnt=document.getElementById('mcount');
    if(cnt){
      var mb=items.reduce(function(a,b){ return a+(b.size||0); },0)/1048576;
      cnt.textContent = items.length
        ? t('mediaCount').replace('{n}',items.length).replace('{mb}',mb.toFixed(1))
        : '';
    }
    if(!items.length){ grid.innerHTML='<div class="empty">'+t('noMedia')+'</div>'; return; }
    grid.innerHTML = items.map(function(it){
      var u=mediaUrl(it.blob);
      var inner = it.kind==='video'
        ? '<video src="'+u+'" muted playsinline preload="metadata"></video><span class="tagv">VIDEO</span>'
        : '<img src="'+u+'" alt="" loading="lazy">';
      return '<button class="mcell" data-mopen="'+it.key+'">'+inner+'</button>';
    }).join('');
  }).catch(function(){
    grid.innerHTML='<div class="empty">'+t('mediaErr')+'</div>';
  });
}
function mediaViewer(matchId,key){
  mediaList(matchId).then(function(items){
    var it=null;
    items.forEach(function(x){ if(String(x.key)===String(key)) it=x; });
    if(!it) return;
    var u=mediaUrl(it.blob);
    var ov=document.createElement('div');
    ov.className='mover'; ov.id='mover';
    ov.innerHTML='<div class="mtop">'
      +'<button data-mclose="1">'+t('mediaClose')+'</button>'
      +'<button data-mdel="'+it.key+'">'+t('mediaDel')+'</button></div>'
      +'<div class="mbody">'+(it.kind==='video'
        ? '<video src="'+u+'" controls playsinline autoplay></video>'
        : '<img src="'+u+'" alt="">')+'</div>'
      +'<div class="mcap">'+esc(it.name||'')+'</div>';
    document.body.appendChild(ov);
  });
}

    +'<div class="factnote">'+esc(L(m.note))+'</div>'
    +'<div class="eyebrow">'+t('myNote')+'</div>'
    +'<div class="field"><textarea data-pf="note" data-id="'+m.id+'" '
    +'placeholder="…">'+esc(p.note||'')+'</textarea></div>'
    +'<div class="eyebrow">'+t('data')+'</div>'
    +f('ticket',t('ticket'),p.ticket)
    +f('seat',t('seat'),p.seat)
    +f('block',t('block'),p.block)
    +f('withWho',t('withWho'),p.withWho)
    +'<div class="warnbox">'+t('saveHint')+'</div>';
}

/* =====================================================================
   tabul EU
   ===================================================================== */
function viewMe(){
  var ms=matches();
  var goals=0,y=0,r=0,pens=0,cardsOk=0,luOk=0;
  var stad={},city={},ctry={},comp={},team={},plr={};
  var big=null,small=null,W=0,D=0,Lz=0;

  ms.forEach(function(m){
    goals += (m.goals||[]).length;
    (m.goals||[]).forEach(function(g){ if(g.pen) pens++; });
    if(m.cardsComplete){
      cardsOk++;
      (m.cards||[]).forEach(function(c){ c.type==='yellow'?y++:r++; });
    }
    inc(stad,m.stadium); inc(city,L(m.city)); inc(ctry,L(m.country));
    inc(comp,L(m.competitionKey||m.competition));
    inc(team,teamName(m.home)); inc(team,teamName(m.away));
    var a=m.attendance&&m.attendance.value;
    if(a){
      if(!big||a>big.v) big={v:a,ms:[m]}; else if(a===big.v) big.ms.push(m);
      if(!small||a<small.v) small={v:a,ms:[m]}; else if(a===small.v) small.ms.push(m);
    }
    if(m.lineups){
      luOk++;
      ['home','away'].forEach(function(sd){
        var lu=m.lineups[sd]; if(!lu) return;
        (lu.xi||[]).forEach(function(p){ inc(plr,p.name); });
        (lu.subs||[]).forEach(function(s){ inc(plr,s.on); });
      });
    }
    var sup=P(m.id).supported;
    if(sup==='home'||sup==='away'){
      var sc=String(m.score).split('-'), hs=+sc[0], as=+sc[1];
      if(hs===as) D++;
      else if((hs>as)===(sup==='home')) W++; else Lz++;
    }
  });

  function top(o){ var k=Object.keys(o); if(!k.length) return null;
    var mx=Math.max.apply(null,k.map(function(x){return o[x];}));
    var tied=k.filter(function(x){ return o[x]===mx; }).sort();
    return {keys:tied,v:mx}; }
  function topRows(r){ if(!r) return '<div class="rows"><div class="row">'
      +'<span class="k na">'+t('na')+'</span></div></div>';
    return '<div class="rows">'+r.keys.map(function(x){
      return '<div class="row"><span class="k">'+esc(x)+'</span>'
        +'<span class="v">'+r.v+'</span></div>'; }).join('')+'</div>'; }
  function list(o){ var k=Object.keys(o);
    k.sort(function(a,b){ return o[b]-o[a] || (a<b?-1:1); });
    return k.map(function(x){
      return '<div class="row"><span class="k">'+esc(x)+'</span><span class="v">'+o[x]+'</span></div>';
    }).join(''); }

  var h='<div class="grid">'
   +st(ms.length,t('nMatches'))
   +st(goals,t('nGoals'),avg(goals,ms.length))
   +st(pens,t('nPens'))+st(Object.keys(stad).length,t('stadiums'))+'</div>';

  h+='<div class="eyebrow">'+t('nYellow')+' / '+t('nRed')+'</div>'
   +'<div class="warnbox">'+t('partial').replace('{a}',cardsOk).replace('{b}',ms.length)+'</div>'
   +'<div class="grid">'+st(y,t('nYellow'),avg(y,cardsOk))
   +st(r,t('nRed'),avg(r,cardsOk))+'</div>';

  h+='<div class="eyebrow">'+t('record')+'</div>';
  if(W+D+Lz===0) h+='<div class="warnbox">'+t('pickSupport')+'</div>';
  else h+='<div class="wdl"><div><b>'+W+'</b><span>'+t('w')+'</span></div>'
        +'<div><b>'+D+'</b><span>'+t('d')+'</span></div>'
        +'<div><b>'+Lz+'</b><span>'+t('l')+'</span></div></div>';

  var tt=top(team), tp=top(plr);
  h+='<div class="eyebrow">'+t('mostTeam')+'</div>'+topRows(tt);
  h+='<div class="eyebrow">'+t('mostPlayer')+'</div>';
  h+= tp ? topRows(tp)
        +'<div class="warnbox">'+t('partial').replace('{a}',luOk).replace('{b}',ms.length)+'</div>'
      : '<div class="warnbox">'+t('noPlayers')+'</div>';

  function crowdRows(o){ return '<div class="rows">'+o.ms.map(function(m){
      return '<div class="row"><span class="k">'+esc(teamName(m.home))+' – '+esc(teamName(m.away))
        +(m.attendance.approx?' *':'')+'</span><span class="v">'+num(o.v)+'</span></div>';
    }).join('')+'</div>'; }
  if(big)   h+='<div class="eyebrow">'+t('biggest')+'</div>'+crowdRows(big);
  if(small) h+='<div class="eyebrow">'+t('smallest')+'</div>'+crowdRows(small);

  h+='<div class="eyebrow">'+t('stadiums')+'</div><div class="rows">'+list(stad)+'</div>';
  h+='<div class="eyebrow">'+t('cities')+'</div><div class="rows">'+list(city)+'</div>';
  h+='<div class="eyebrow">'+t('countries')+'</div><div class="rows">'+list(ctry)+'</div>';
  h+='<div class="eyebrow">'+t('comps')+'</div><div class="rows">'+list(comp)+'</div>';

  h+='<div class="eyebrow">'+t('import')+'</div>'
   +'<div class="warnbox">'+t('importHint')+'</div>'
   +'<div class="field"><textarea id="impBox" placeholder="{ … }"></textarea></div>'
   +'<button class="btn" id="impBtn">'+t('add')+'</button> '
   +'<button class="btn ghost" id="expBtn">'+t('exportBtn')+'</button>';
  return h;
}
function st(n,l,sub){ return '<div class="stat"><b>'+num(n)+'</b><span>'+l+'</span>'
  +(sub?'<i>'+sub+'</i>':'')+'</div>'; }
function avg(n,d){
  if(!d) return '';
  var v=(n/d).toFixed(2);
  if(lang==='ro') v=v.replace('.',',');
  return v+' '+t('perMatch');
}
function inc(o,k){ if(!k) return; o[k]=(o[k]||0)+1; }

/* =====================================================================
   evenimente
   ===================================================================== */
function viewEvents(){
  var ev=APP_DATA.events||[];
  if(!ev.length) return '<div class="empty">'+t('noEvents')+'</div>';
  return ev.map(function(e,i){
    return '<div class="stub"><div class="num">'+(i+1)+'</div><div class="body">'
      +'<button class="teams" data-open="'+esc(e.id)+'" style="width:100%">'
      +'<span class="t" style="text-align:left">'+esc(L(e.title))+'</span></button>'
      +'<div class="meta">'+esc(L(e.place))+' · '+fmtDate(e.date)+'</div>'
      +'</div></div>';
  }).join('');
}

/* =====================================================================
   evenimente UI
   ===================================================================== */
function toast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(function(){ el.classList.remove('show'); },1900);
}
document.addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  if(b.dataset.tab){ tab=b.dataset.tab; openId=null; render(); return; }
  if(b.dataset.open){
    openId=b.dataset.open;
    sub = findEvent(openId) ? 'notes' : 'lineups';
    side='home'; render(); return;
  }
  if(b.dataset.close){ openId=null; render(); return; }
  if(b.dataset.sub){ sub=b.dataset.sub; render(); return; }
  if(b.dataset.side){ side=b.dataset.side; render(); return; }
  if(b.dataset.mopen){ mediaViewer(openId,b.dataset.mopen); return; }
  if(b.dataset.mclose){ var o=document.getElementById('mover'); if(o) o.remove(); return; }
  if(b.dataset.mdel){
    var key=b.dataset.mdel, mid=openId;
    if(!confirm(t('mediaDelAsk'))) return;
    mediaDelete(Number(key)).then(function(){
      var o=document.getElementById('mover'); if(o) o.remove();
      toast(t('mediaDeleted')); mediaRender(mid);
    }).catch(function(){ toast(t('mediaErr')); });
    return;
  }
  if(b.dataset.sup){
    var cur=P(b.dataset.sup).supported;
    setP(b.dataset.sup,'supported', cur===b.dataset.val ? '' : b.dataset.val);
    render(); return;
  }
  if(b.id==='langBtn'){ lang = lang==='ro'?'en':'ro'; save(LS_L,lang); render(); return; }
  if(b.id==='themeBtn'){ theme = theme==='dark'?'light':'dark'; save(LS_T,theme); render(); return; }
  if(b.id==='impBtn'){
    var raw=document.getElementById('impBox').value.trim();
    if(!raw) return;
    try{
      var obj=JSON.parse(raw), arr=Array.isArray(obj)?obj:[obj], ok=0;
      arr.forEach(function(m){
        if(!m || !m.id) throw new Error('no id');
        var i=imported.findIndex(function(x){return x.id===m.id;});
        if(i>=0) imported[i]=m; else imported.push(m);
        ok++;
      });
      save(LS_I,imported);
      document.getElementById('impBox').value='';
      toast(t('imported')); render();
    }catch(err){ toast(t('badJson')); }
    return;
  }
  if(b.id==='expBtn'){
    var dump=JSON.stringify({personal:personal,imported:imported},null,1);
    var box=document.getElementById('impBox');
    box.value=dump; box.focus(); box.select();
    toast(t('copied')); return;
  }
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.dataset && el.dataset.pf) setP(el.dataset.id, el.dataset.pf, el.value);
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id!=='mfile' || !el.files || !el.files.length) return;
  var mid=el.dataset.mid, files=Array.prototype.slice.call(el.files), ok=0;
  files.reduce(function(chain,f){
    return chain.then(function(){
      return mediaAdd(mid,f).then(function(){ ok++; });
    }).catch(function(err){
      var full = err && (err.name==='QuotaExceededError' || String(err).indexOf('Quota')>=0);
      toast(full ? t('mediaFull') : t('mediaErr'));
    });
  },Promise.resolve()).then(function(){
    el.value='';
    if(ok) toast(t('mediaAdded'));
    mediaRender(mid);
  });
});
render();
</script>
